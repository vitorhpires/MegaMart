
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MegaMart</title>

    <link rel="stylesheet" href="CSS/style.css">

    <!-- Biblioteca de ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- Barra superior -->
    <div class="top-bar">

        <p>Welcome to worldwide Megamart!</p>

        <div class="top-links">

            <span>
                <i class="fa-solid fa-location-dot"></i>
                Deliver to 423651
            </span>

            <span>
                <i class="fa-solid fa-truck"></i>
                Track your order
            </span>

            <span>
                <i class="fa-solid fa-tag"></i>
                All Offers
            </span>

        </div>

    </div>


    <!-- Cabeçalho -->
    <header class="header">

        <div class="logo">

            <span class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </span>

            <h1>MegaMart</h1>

        </div>


        <!-- Barra de pesquisa -->
        <div class="search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search essentials, groceries and more..."
            >

        </div>


        <!-- Conta e carrinho -->
        <div class="account">

            <span>
                <i class="fa-regular fa-user"></i>
                Sign Up/Sign In
            </span>

            <span>
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </span>

        </div>

    </header>


    <!-- Categorias -->
    <nav class="categories">

        <a href="#" class="active">Groceries</a>

        <a href="#">Premium Fruits</a>

        <a href="#">Home & Kitchen</a>

        <a href="#">Fashion</a>

        <a href="#">Electronics</a>

        <a href="#">Beauty</a>

        <a href="#">Home Improvement</a>

        <a href="#">Sports, Toys & Luggage</a>

    </nav>


    <!-- Conteúdo principal -->
    <main>

        <section class="banner">


            <!-- Textos do banner -->
            <div class="banner-text">

                <p>Best Deal Online on smart watches</p>

                <h2>SMART WEARABLE.</h2>

                <h3>UP to 80% OFF</h3>


                <!-- Indicadores -->
                <div class="dots">

                    <span class="selected"></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>


            <!-- Imagem do relógio -->
            <div class="banner-image">

                <img src="Assets/relogio.png.png" alt="Smartwatch">

            </div>


            <!-- Setas laterais -->
            <button class="arrow left">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="arrow right">
                <i class="fa-solid fa-chevron-right"></i>
            </button>


        </section>

    </main>

</body>

</html>
